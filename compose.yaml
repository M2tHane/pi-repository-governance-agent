services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pi_governance
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pi_governance"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
